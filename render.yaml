services:
  - type: web
    name: restaurant-inventory-backend
    runtime: node
    plan: free
    region: frankfurt
    rootDir: .
    buildCommand: npm install --include=dev && npx prisma generate --schema=backend/prisma/schema.prisma && npm run build -w packages/shared && npm run build -w backend
    startCommand: node backend/dist/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: CORS_ORIGIN
        sync: false
      - key: EMAIL_ALERTS_ENABLED
        value: "false"
      - key: CRON_LOW_STOCK_SCHEDULE
        value: "0 * * * *"
